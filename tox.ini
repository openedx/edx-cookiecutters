[tox]
envlist = py{314}
skipsdist = true
# NOTE: python-template's and cookiecutter-python-library's own tox.ini (not this
# one) are still pinned to `envlist = py312-...` and haven't been migrated yet. Now
# that this repo's own dev/test tooling runs on 3.14, tests that bake those templates
# and shell out to their inner tox run (test_tests / test_tests_and_quality) fail with
# "could not find python interpreter matching any of the specs py312", since only 3.14
# is available to the nested venv. This is expected until those templates move to uv
# (tracked as a follow-up); see tests/test_cookiecutter_django_app.py::test_tests and
# tests/test_cookiecutter_python_library.py::test_tests_and_quality.

[isort]
include_trailing_comma = True
indent = '    '
line_length = 120
multi_line_output = 3

[pycodestyle]
max-line-length = 120

[pydocstyle]
ignore = D200,D203,D212,D215,D404,D405,D406,D407,D408,D409,D410,D411,D412,D413,D414

[pytest]
norecursedirs = .* docs site-packages

[testenv]
runner = uv-venv-lock-runner
# The test suite bakes cookiecutter templates and shells out to their
# (still pip-based) Makefiles/pip-tools, so the venv needs pip on PATH.
uv_seed = true
setenv = EDX_COOKIECUTTER_ROOTDIR = {toxinidir}
dependency_groups = test
commands =
    pytest {posargs}

[testenv:quality]
allowlist_externals =
    make
commands =
    make quality
