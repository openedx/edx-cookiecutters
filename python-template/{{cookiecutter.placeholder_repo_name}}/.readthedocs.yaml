# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Set the version of python needed to build these docs.
build:
  os: "ubuntu-lts-latest"
  tools:
    python: "3.12"

python:
  install:
    # This will pip install this repo (with its "docs" extra) into the python
    # environment. If you are using this in a repo that is not pip installable
    # then you should remove this and add an explicit requirements install instead.
    - method: pip
      path: .
      extra_requirements:
        - docs
